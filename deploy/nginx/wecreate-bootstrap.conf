# The virtual host as it exists for the few seconds before a certificate does.
#
# A TLS server block cannot name a certificate that has not been issued yet —
# `nginx -t` fails on the missing file, and on this machine a failing `nginx -t`
# means the reload is refused and the two sites next door keep running the old
# config. That is the safe failure, but it is still a failure, so the first
# vhost installed is this one: plain HTTP, serving nothing but the ACME
# challenge, which is exactly what certbot's webroot plugin needs to prove the
# name.
#
# `deploy/bin/provision.sh` replaces it with `wecreate.conf` the moment the
# certificate exists.
#
# A template: @NAME@ placeholders come from `deploy/deployment.env`.

server {
    listen 80;
    listen [::]:80;

    # Named explicitly, and no `default_server` anywhere in this file. That is
    # the one line that keeps this vhost from quietly becoming the catch-all
    # for requests meant for weact.bj.
    server_name @SITE_HOST@;

    location /.well-known/acme-challenge/ {
        root @ACME_WEBROOT@;
    }

    # Anything else, before there is an application to answer it.
    location / {
        return 404;
    }
}
