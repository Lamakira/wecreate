# The WeCreate virtual host.
#
# A template: `deploy/bin/provision.sh` substitutes the @NAME@ placeholders from
# `deploy/deployment.env` and installs the result at
# /etc/nginx/sites-available/wecreate, symlinked into sites-enabled.
#
# Three things this file is careful about, all of them because it is not the
# only site on this machine:
#
#   * no `default_server`, so a request for a name nobody claims still lands
#     where it landed before WeCreate existed;
#   * no `http`-level directive, because that would mean editing nginx.conf —
#     everything here is scoped inside these two server blocks;
#   * `certonly --webroot` issued the certificate, so certbot has never
#     rewritten a line of this file or of either neighbour's.

server {
    listen 80;
    listen [::]:80;
    server_name @SITE_HOST@;

    # Renewal happens over HTTP-01 and has to keep working after the redirect
    # below exists, so the challenge location is matched first.
    location /.well-known/acme-challenge/ {
        root @ACME_WEBROOT@;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # How HTTP/2 is asked for moved in nginx 1.25.1: the `http2 on;` directive
    # replaced a parameter on `listen`, and the older nginx does not recognise
    # the directive at all — it fails `nginx -t` with `unknown directive
    # "http2"`, which on this machine means a refused reload and a WeCreate
    # vhost that never comes up. provision.sh reads the running nginx's version
    # and renders whichever of the two forms it understands.
    listen 443 ssl@HTTP2_LISTEN@;
    listen [::]:443 ssl@HTTP2_LISTEN@;
    @HTTP2_DIRECTIVE@
    server_name @SITE_HOST@;

    ssl_certificate     /etc/letsencrypt/live/@SITE_HOST@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@SITE_HOST@/privkey.pem;
    # certbot's recommended TLS settings when its nginx plugin has put them on
    # the machine, and an equivalent written out inline when it has not — this
    # deployment uses `certonly --webroot` precisely so that plugin never runs,
    # and an `include` of a file that does not exist is a config error, which
    # here means a refused reload and a site that never comes up.
    # provision.sh chooses between the two.
@SSL_HARDENING@

    # The upload ceiling a Paid Deliverable Version travels in, and one of the
    # three numbers that have to agree: MAX_DELIVERABLE_BYTES is 25 MB in
    # `src/commerce/paid-deliverables.ts`, and both this and
    # `serverActions.bodySizeLimit` in `next.config.ts` sit one megabyte above
    # it, because they bound the whole multipart body rather than the file
    # inside it. Set too low, a Commerce Operator gets nginx's own 413 with no
    # French wording and no explanation; the application never sees the request.
    client_max_body_size @MAX_BODY_SIZE@;

    # Who may reach this origin. With no CDN in front there is nothing to
    # restrict, so the file provision.sh writes here holds only an explanation
    # of why it is empty. It exists all the same, because an nginx `include` of
    # a missing file is a config error — which is what makes putting a CDN in
    # front later one run of `deploy/bin/refresh-cloudflare-ips.sh` rather than
    # an edit to a live virtual host.
    include /etc/nginx/snippets/@APP_USER@-origin.conf;

    location / {
        proxy_pass http://127.0.0.1:@APP_PORT@;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Off, deliberately. Cache Components streams a prerendered shell first
        # and the dynamic holes after it; nginx's default buffering collects the
        # whole response before sending any of it, which turns that into one
        # slow render and quietly removes the time-to-first-byte property
        # ADR-0003 spends `cacheComponents` to get. Next.js' self-hosting guide
        # names this as the thing to change behind a reverse proxy.
        proxy_buffering off;
        # Request buffering stays *on*, which is the default and is the
        # opposite decision from the line above. Absorbing a slow upload and
        # handing the application a complete request is one of the specific
        # jobs Next.js' self-hosting guide puts on a reverse proxy; turning it
        # off would stream a 25 MB deliverable through the Node process at
        # whatever rate the client felt like, and hold a render worker open for
        # the duration.

        # A route handler may take a while — the FedaPay webhook carries a
        # maxDuration of its own — and the default 60s read timeout would cut
        # it off at the proxy with a 504 the application never learns about.
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
