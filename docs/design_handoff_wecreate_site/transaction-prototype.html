<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>PROTOTYPE — Parcours transactionnel WeCreate</title>
  <!--
    Three transaction variants, switchable via ?variant=, on the new throwaway /transaction-prototype.html route.

    THESIS: Transaction truth should feel cinematic without becoming theatrical; this prototype refuses a generic stack of checkout cards.
    OWN-WORLD: Pure black and white, square rules, editorial serif headlines, precise sans-serif controls, and one animated verification line.
    STORY: A guest sees what is in the order, understands the current payment and fulfillment truth, and always finds one safe next action.
    FIRST VIEWPORT: WeCreate chrome, explicit prototype/state controls, then one dominant transaction surface with the order visible beside or inside it.
    FORM: Three inherited-world structures—editorial sheet, verification ledger, split transaction ticket—selected directly because the handoff requires comparison.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;family=Playfair+Display:ital,wght@0,500;1,500&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #0a0a0a;
      --pure: #000;
      --surface: #0f0f0f;
      --line-dark: #262626;
      --line-light: #dedede;
      --soft-dark: #bdbdbd;
      --soft-light: #4a4a4a;
      --white: #fff;
      --ease: cubic-bezier(.16, 1, .3, 1);
    }

    * { box-sizing: border-box; }
    html { background: var(--black); scroll-behavior: smooth; }
    body { margin: 0; min-width: 320px; background: var(--black); color: var(--white); font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    button, input, select { font: inherit; }
    button, a, input, select { border-radius: 0; }
    button { cursor: pointer; }
    a { color: inherit; }
    :focus-visible { outline: 3px solid currentColor; outline-offset: 4px; }
    ::selection { background: #fff; color: #000; }

    .prototype-ribbon { background: #fff; color: #000; padding: 9px 20px; text-align: center; font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
    .site-header { min-height: 72px; padding: 16px clamp(18px, 4vw, 56px); display: flex; align-items: center; justify-content: space-between; gap: 24px; border-bottom: 1px solid var(--line-dark); background: rgba(10,10,10,.96); }
    .site-header img { display: block; width: 166px; max-width: 42vw; height: 22px; object-fit: contain; object-position: left; }
    .site-header__meta { display: flex; align-items: center; gap: 26px; color: var(--soft-dark); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; }
    .site-header__meta strong { color: #fff; font-weight: 500; }

    .review-tools { position: relative; z-index: 5; padding: 16px clamp(18px, 4vw, 56px); display: flex; align-items: center; justify-content: space-between; gap: 20px; border-bottom: 1px solid var(--line-dark); background: #000; }
    .review-tools__hint { margin: 0; color: var(--soft-dark); font-size: 12px; line-height: 1.55; }
    .state-nav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .state-nav button, .state-select { min-height: 38px; border: 1px solid #3d3d3d; background: transparent; color: #d8d8d8; padding: 9px 12px; font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
    .state-nav button[aria-current="true"] { background: #fff; color: #000; border-color: #fff; }
    .state-select { display: none; width: 100%; }

    #app { min-height: calc(100vh - 154px); }
    .screen { min-height: calc(100vh - 154px); animation: reveal .55s var(--ease) both; }
    @keyframes reveal { from { opacity: .55; clip-path: inset(0 0 10% 0); } to { opacity: 1; clip-path: inset(0); } }
    .serif { font-family: "Playfair Display", Georgia, serif; }
    .eyebrow { margin: 0; font-size: 10px; font-weight: 600; letter-spacing: .26em; text-transform: uppercase; }
    .title { max-width: 13ch; margin: 16px 0 22px; font-family: "Playfair Display", Georgia, serif; font-size: clamp(38px, 6vw, 82px); font-weight: 500; line-height: .98; letter-spacing: -.025em; text-wrap: balance; }
    .lede { max-width: 61ch; margin: 0; font-size: clamp(14px, 1.35vw, 17px); font-weight: 300; line-height: 1.75; }
    .micro { font-size: 10px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; }
    .muted-on-light { color: var(--soft-light); }
    .muted-on-dark { color: var(--soft-dark); }
    .rule { border: 0; border-top: 1px solid currentColor; opacity: .18; margin: 28px 0; }
    .button { min-height: 50px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; border: 1px solid currentColor; padding: 14px 20px; font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; text-decoration: none; }
    .button--dark { background: #000; color: #fff; border-color: #000; }
    .button--light { background: #fff; color: #000; border-color: #fff; }
    .button--ghost-light { background: transparent; color: #000; border-color: #000; }
    .button--ghost-dark { background: transparent; color: #fff; border-color: #777; }
    .button:disabled { cursor: not-allowed; opacity: .45; }
    .button:hover:not(:disabled) { filter: invert(1); }

    .order-list { margin: 0; padding: 0; list-style: none; }
    .order-item { display: grid; grid-template-columns: 62px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 18px 0; border-top: 1px solid currentColor; }
    .order-item:last-child { border-bottom: 1px solid currentColor; }
    .product-mark { width: 62px; aspect-ratio: 1; display: grid; place-items: center; border: 1px solid currentColor; font-family: "Playfair Display", Georgia, serif; font-size: 24px; font-style: italic; }
    .order-item h3 { margin: 0 0 5px; font-family: "Playfair Display", Georgia, serif; font-size: 18px; font-weight: 500; line-height: 1.1; }
    .order-item p, .order-item small { margin: 0; color: inherit; opacity: .68; font-size: 11px; line-height: 1.5; }
    .order-item strong { font-size: 12px; white-space: nowrap; }
    .total { display: flex; align-items: baseline; justify-content: space-between; gap: 20px; margin-top: 22px; }
    .total strong { font-family: "Playfair Display", Georgia, serif; font-size: 30px; font-weight: 500; }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .field { display: grid; gap: 8px; }
    .field--full { grid-column: 1 / -1; }
    .field label { font-size: 10px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }
    .field input { width: 100%; min-height: 52px; border: 1px solid currentColor; background: transparent; color: inherit; padding: 14px; }
    .field input::placeholder { color: currentColor; opacity: .55; }
    .checks { display: grid; gap: 12px; margin: 22px 0; }
    .check { display: grid; grid-template-columns: 20px 1fr; gap: 10px; font-size: 12px; line-height: 1.55; }
    .check input { width: 18px; height: 18px; accent-color: #000; }
    .error-copy { display: none; margin: 12px 0 0; font-size: 12px; font-weight: 600; }
    .error-copy[data-visible="true"] { display: block; }

    .state-symbol { width: clamp(64px, 8vw, 104px); aspect-ratio: 1; display: grid; place-items: center; border: 1px solid currentColor; font-family: "Playfair Display", Georgia, serif; font-size: clamp(30px, 4vw, 52px); }
    .state-facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; margin: 30px 0; background: currentColor; border: 1px solid currentColor; }
    .state-fact { min-height: 104px; padding: 16px; background: var(--white); color: var(--black); }
    .state-fact p { margin: 10px 0 0; font-size: 13px; line-height: 1.45; }
    .state-fact strong { display: block; font-size: 10px; letter-spacing: .15em; text-transform: uppercase; }

    .access-list { display: grid; gap: 1px; background: currentColor; border: 1px solid currentColor; margin-top: 28px; }
    .access-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: center; padding: 18px; background: var(--white); color: var(--black); }
    .access-row h3 { margin: 0 0 5px; font-family: "Playfair Display", Georgia, serif; font-size: 20px; font-weight: 500; }
    .access-row p { margin: 0; color: #4a4a4a; font-size: 12px; line-height: 1.5; }
    .download-action { display: flex; align-items: center; gap: 14px; }
    .download-action span { min-width: 70px; text-align: right; font-size: 10px; font-weight: 700; line-height: 1.35; text-transform: uppercase; }

    /* Variant A — pale editorial sheet with a sticky order column. */
    .variant-a { background: #fff; color: #000; padding: clamp(34px, 6vw, 86px) clamp(18px, 5vw, 72px) 120px; }
    .a-layout { max-width: 1440px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(280px, .65fr); gap: clamp(36px, 7vw, 110px); align-items: start; }
    .a-main { max-width: 820px; }
    .a-summary { position: sticky; top: 28px; padding: 24px; border: 1px solid #000; }
    .a-summary h2 { margin: 12px 0 22px; font-family: "Playfair Display", Georgia, serif; font-size: 28px; font-weight: 500; }
    .a-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 28px; }
    .a-status-line { width: 100%; height: 2px; margin: 28px 0; background: #d7d7d7; overflow: hidden; }
    .a-status-line::after { content: ""; display: block; width: 36%; height: 100%; background: #000; animation: verify 1.6s var(--ease) 3; }
    @keyframes verify { from { transform: translateX(-110%); } to { transform: translateX(310%); } }
    .drawer-demo { position: relative; min-height: calc(100vh - 154px); overflow: hidden; background: #fff; color: #000; }
    .drawer-demo__boutique { padding: clamp(44px, 8vw, 110px) clamp(18px, 5vw, 72px); opacity: .24; }
    .drawer-demo__boutique h1 { max-width: 11ch; margin: 18px 0; font-family: "Playfair Display", Georgia, serif; font-size: clamp(48px, 8vw, 110px); font-weight: 500; line-height: .96; }
    .drawer-demo__tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 60px; }
    .drawer-demo__tile { min-height: 280px; border: 1px solid #000; }
    .drawer-demo__veil { position: absolute; inset: 0; background: rgba(0,0,0,.64); }
    .drawer-panel { position: absolute; z-index: 1; inset: 0 0 0 auto; width: min(470px, 100%); display: flex; flex-direction: column; padding: clamp(24px, 4vw, 42px); background: #0a0a0a; color: #fff; border-left: 1px solid #333; }
    .drawer-panel__head { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding-bottom: 22px; border-bottom: 1px solid #333; }
    .drawer-panel__head h1 { margin: 0; font-family: "Playfair Display", Georgia, serif; font-size: 34px; font-weight: 500; }
    .drawer-panel__head button { width: 42px; height: 42px; border: 1px solid #555; background: transparent; color: #fff; font-size: 22px; }
    .drawer-panel__body { flex: 1; min-height: 0; overflow: auto; padding-top: 20px; }
    .drawer-panel__foot { padding-top: 22px; border-top: 1px solid #333; }
    .drawer-panel .button { width: 100%; margin-top: 20px; }

    /* Variant B — dark ledger with persistent state index and wide task canvas. */
    .variant-b { background: var(--black); color: #fff; padding: 0 0 120px; }
    .b-grid { min-height: calc(100vh - 154px); display: grid; grid-template-columns: minmax(230px, 310px) minmax(0, 1fr); }
    .b-rail { padding: clamp(28px, 4vw, 52px) 24px; border-right: 1px solid var(--line-dark); background: #000; }
    .b-rail h2 { max-width: 8ch; margin: 18px 0 34px; font-family: "Playfair Display", Georgia, serif; font-size: 34px; font-weight: 500; line-height: 1.05; }
    .b-steps { margin: 0; padding: 0; list-style: none; }
    .b-steps li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; padding: 14px 0; border-top: 1px solid var(--line-dark); color: #777; font-size: 11px; line-height: 1.4; }
    .b-steps li[data-active="true"] { color: #fff; }
    .b-steps li span:first-child { font-variant-numeric: tabular-nums; }
    .b-work { padding: clamp(34px, 6vw, 82px) clamp(20px, 5vw, 78px); }
    .b-work__inner { max-width: 980px; }
    .b-work .title { max-width: 11ch; }
    .b-ledger { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(260px, .65fr); gap: 1px; margin-top: 40px; border: 1px solid #333; background: #333; }
    .b-panel { min-width: 0; padding: clamp(22px, 3vw, 36px); background: var(--surface); }
    .b-panel h2 { margin: 0 0 22px; font-family: "Playfair Display", Georgia, serif; font-size: 26px; font-weight: 500; }
    .b-panel .field input { background: #0a0a0a; border-color: #555; }
    .b-panel .state-facts { color: #fff; }
    .b-panel .state-fact, .b-panel .access-row { background: #0a0a0a; color: #fff; }
    .b-panel .access-row p { color: #bdbdbd; }
    .b-panel .button--dark { background: #fff; color: #000; border-color: #fff; }
    .b-panel .check input { accent-color: #fff; }
    .b-proof { display: flex; gap: 14px; align-items: flex-start; margin: 24px 0; padding: 18px 0; border-block: 1px solid #333; }
    .b-proof strong { display: block; margin-bottom: 6px; font-size: 12px; }
    .b-proof p { margin: 0; color: #bbb; font-size: 12px; line-height: 1.6; }

    /* Variant C — split transaction ticket; summary becomes the first mobile strip. */
    .variant-c { background: #fff; color: #000; padding-bottom: 120px; }
    .c-shell { min-height: calc(100vh - 154px); display: grid; grid-template-columns: minmax(280px, .74fr) minmax(0, 1.26fr); }
    .c-ticket { padding: clamp(28px, 5vw, 64px); background: #000; color: #fff; display: flex; flex-direction: column; justify-content: space-between; border-right: 1px solid #000; }
    .c-ticket__top { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .c-ticket__number { font-family: "Playfair Display", Georgia, serif; font-size: clamp(62px, 9vw, 130px); font-weight: 500; line-height: .8; letter-spacing: -.04em; }
    .c-ticket__items { margin-top: 52px; }
    .c-ticket .order-item { grid-template-columns: minmax(0, 1fr) auto; }
    .c-ticket .product-mark { display: none; }
    .c-stage { padding: clamp(34px, 6vw, 82px) clamp(20px, 6vw, 86px); }
    .c-stage__inner { max-width: 820px; }
    .c-stage .title { max-width: 12ch; }
    .c-actions { display: grid; grid-template-columns: 1fr auto; gap: 12px; margin-top: 30px; }
    .c-actions .button:first-child { min-width: 230px; }
    .c-progress { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 34px; }
    .c-progress span { height: 5px; background: #ddd; }
    .c-progress span[data-active="true"] { background: #000; }
    .c-stage .state-symbol { float: right; margin: 0 0 26px 26px; }

    .provider-frame { border: 1px solid currentColor; padding: 26px; margin-top: 28px; }
    .provider-frame__head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-bottom: 18px; border-bottom: 1px solid currentColor; }
    .provider-frame__body { padding: 38px 0 18px; text-align: center; }
    .provider-frame__body strong { display: block; margin: 10px 0; font-family: "Playfair Display", Georgia, serif; font-size: 31px; font-weight: 500; }
    .provider-frame__body p { max-width: 48ch; margin: 0 auto 22px; font-size: 13px; line-height: 1.6; }

    .prototype-switcher { position: fixed; z-index: 50; left: 50%; bottom: 18px; transform: translateX(-50%); width: min(520px, calc(100% - 24px)); min-height: 54px; display: grid; grid-template-columns: 54px 1fr 54px; align-items: stretch; background: #fff; color: #000; border: 2px solid #000; box-shadow: 8px 8px 0 rgba(255,255,255,.28); }
    .prototype-switcher button { border: 0; background: #000; color: #fff; font-size: 21px; }
    .prototype-switcher button:hover { background: #333; }
    .prototype-switcher__label { display: grid; place-items: center; padding: 8px 12px; text-align: center; font-size: 11px; font-weight: 700; line-height: 1.35; letter-spacing: .08em; text-transform: uppercase; }
    .toast { position: fixed; z-index: 60; right: 20px; top: 20px; max-width: 340px; padding: 16px 18px; background: #fff; color: #000; border: 2px solid #000; font-size: 12px; line-height: 1.5; transform: translateY(-160%); transition: transform .4s var(--ease); }
    .toast[data-visible="true"] { transform: translateY(0); }

    @media (max-width: 900px) {
      .site-header__meta span { display: none; }
      .review-tools { display: block; }
      .review-tools__hint { margin-bottom: 12px; }
      .state-nav { display: none; }
      .state-select { display: block; background: #000; }
      .a-layout, .b-grid, .c-shell { grid-template-columns: 1fr; }
      .a-summary { position: static; }
      .b-rail { border-right: 0; border-bottom: 1px solid var(--line-dark); }
      .b-rail h2 { max-width: none; margin-bottom: 18px; }
      .b-steps { display: grid; grid-template-columns: repeat(4, 1fr); }
      .b-steps li { display: block; min-width: 0; padding-right: 8px; }
      .b-steps li span { display: block; margin-bottom: 4px; }
      .b-ledger { grid-template-columns: 1fr; }
      .c-ticket { min-height: auto; border-right: 0; }
      .c-ticket__number { font-size: 66px; }
      .c-ticket__items { margin-top: 28px; }
    }

    @media (max-width: 620px) {
      .prototype-ribbon { text-align: left; }
      .site-header { min-height: 62px; }
      .site-header img { content: url("assets/icone-blanc.svg"); width: 25px; }
      .site-header__meta { gap: 12px; }
      .variant-a, .b-work, .c-stage { padding-inline: 18px; }
      .a-summary { padding: 18px; }
      .drawer-demo__tiles { grid-template-columns: 1fr; }
      .drawer-panel { border-left: 0; padding-bottom: 88px; }
      .form-grid, .state-facts { grid-template-columns: 1fr; }
      .state-fact { min-height: 82px; }
      .order-item { grid-template-columns: 48px minmax(0, 1fr); }
      .product-mark { width: 48px; }
      .order-item strong { grid-column: 2; }
      .access-row { grid-template-columns: 1fr; }
      .download-action { justify-content: space-between; }
      .download-action span { text-align: left; }
      .b-rail { padding-inline: 18px; overflow: hidden; }
      .b-steps { width: max-content; grid-template-columns: repeat(8, 118px); }
      .c-actions { grid-template-columns: 1fr; }
      .c-actions .button:first-child { min-width: 0; }
      .c-stage .state-symbol { float: none; margin: 0 0 26px; }
      .c-ticket { padding: 20px 18px; }
      .c-ticket__items { margin-top: 16px; }
      .c-ticket__items .order-list { display: none; }
      .c-ticket__items .total { margin-top: 0; }
      .prototype-switcher { bottom: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
    }

    @media print {
      .prototype-ribbon, .review-tools, .prototype-switcher, .toast { display: none !important; }
      .screen { min-height: 0; }
    }
  </style>
</head>
<body>
  <div class="prototype-ribbon">Prototype jetable · Données de démonstration · Aucun paiement réel</div>
  <header class="site-header">
    <img src="assets/logo-blanc.svg" alt="WeCreate">
    <div class="site-header__meta"><span>Boutique / Transaction</span><strong id="header-state">Panier numérique</strong></div>
  </header>
  <section class="review-tools" aria-label="États du prototype">
    <p class="review-tools__hint"><strong>État à examiner.</strong> Le choix reste dans l’URL et fonctionne dans les trois variantes.</p>
    <nav class="state-nav" id="state-nav" aria-label="Changer l’état transactionnel"></nav>
    <select class="state-select" id="state-select" aria-label="Changer l’état transactionnel"></select>
  </section>
  <main id="app" tabindex="-1"></main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <aside class="prototype-switcher" aria-label="Changer de variante visuelle">
    <button type="button" id="prev-variant" aria-label="Variante précédente">←</button>
    <div class="prototype-switcher__label" id="variant-label" aria-live="polite"></div>
    <button type="button" id="next-variant" aria-label="Variante suivante">→</button>
  </aside>

  <script>
    const variants = [
      { key: 'A', name: 'Feuille éditoriale claire' },
      { key: 'B', name: 'Registre de vérification sombre' },
      { key: 'C', name: 'Ticket transactionnel scindé' }
    ];

    const states = [
      { key: 'cart', short: 'Panier', label: 'Panier numérique' },
      { key: 'checkout', short: 'Coordonnées', label: 'Finaliser la commande' },
      { key: 'redirect', short: 'FedaPay', label: 'Redirection FedaPay' },
      { key: 'pending', short: 'Vérification', label: 'Vérification du paiement' },
      { key: 'paid', short: 'Payé', label: 'Paiement confirmé' },
      { key: 'failed', short: 'Échec', label: 'Paiement non abouti' },
      { key: 'price', short: 'Prix modifié', label: 'Le prix a changé' },
      { key: 'fulfillment', short: 'Livraison', label: 'Livraison à relancer' }
    ];

    const products = [
      { id: 'ebook', mark: 'Cg', title: 'Color Grading Signature', kind: 'Ebook · PDF', price: 15000 },
      { id: 'lut', mark: 'Lut', title: 'Teal & Orange Cinéma', kind: 'LUT · ZIP', price: 12000 }
    ];

    const stateCopy = {
      cart: {
        eyebrow: 'Panier numérique · 2 articles distincts',
        title: 'Vos outils, prêts à vous suivre.',
        lede: 'Deux produits numériques. Aucun service, aucun abonnement : la livraison se fera par email dès que le paiement aura été confirmé.',
        symbol: '02'
      },
      checkout: {
        eyebrow: 'Commande WC-24-0811 · Invité',
        title: 'Où devons-nous livrer vos fichiers ?',
        lede: 'Votre email reçoit le reçu et l’accès aux téléchargements. Le téléphone au format international sert au paiement Mobile Money.',
        symbol: '→'
      },
      redirect: {
        eyebrow: 'Étape externe · Paiement sécurisé',
        title: 'Vous quittez WeCreate un instant.',
        lede: 'La page hébergée par FedaPay recueille le moyen de paiement. WeCreate ne voit ni ne conserve vos informations de carte ou Mobile Money.',
        symbol: '↗'
      },
      pending: {
        eyebrow: 'Commande WC-24-0811 · Retour FedaPay',
        title: 'Vérification du paiement.',
        lede: 'Nous attendons la confirmation sécurisée de FedaPay. Ne relancez pas le paiement maintenant : cela peut prendre quelques instants.',
        symbol: '…'
      },
      paid: {
        eyebrow: 'Commande WC-24-0811 · Paiement approuvé',
        title: 'Vos outils sont disponibles.',
        lede: 'Le reçu et les mêmes accès viennent d’être envoyés à a***@exemple.com. Vous pouvez aussi télécharger ici pendant 30 jours.',
        symbol: '✓'
      },
      failed: {
        eyebrow: 'Commande WC-24-0811 · Paiement non approuvé',
        title: 'Rien n’a été débité.',
        lede: 'Le paiement a échoué ou a été annulé. Votre commande et ses prix restent réservés pendant 24 heures : vous pouvez réessayer sans refaire le panier.',
        symbol: '×'
      },
      price: {
        eyebrow: 'Panier actualisé · Action requise',
        title: 'Un prix a changé.',
        lede: 'Le prix de Teal & Orange Cinéma a été mis à jour depuis son ajout. Vérifiez le nouveau total avant de poursuivre.',
        symbol: '↕'
      },
      fulfillment: {
        eyebrow: 'Commande WC-24-0811 · Paiement approuvé',
        title: 'Paiement reçu. Livraison retardée.',
        lede: 'Votre paiement est bien confirmé et ne doit pas être recommencé. Nous n’avons pas encore pu préparer les fichiers ni envoyer l’email.',
        symbol: '!'
      }
    };

    let downloads = { ebook: 5, lut: 5 };
    let toastTimer;

    function money(value) {
      return new Intl.NumberFormat('fr-FR').format(value).replace(/\u202f/g, ' ') + ' FCFA';
    }

    function query() {
      const params = new URLSearchParams(location.search);
      const variant = variants.some(v => v.key === params.get('variant')) ? params.get('variant') : 'A';
      const state = states.some(s => s.key === params.get('state')) ? params.get('state') : 'cart';
      return { params, variant, state };
    }

    function navigate(patch, focusApp = true) {
      const { params } = query();
      Object.entries(patch).forEach(([key, value]) => params.set(key, value));
      history.replaceState({}, '', location.pathname + '?' + params.toString());
      render();
      if (focusApp) document.getElementById('app').focus({ preventScroll: true });
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.dataset.visible = 'true';
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.dataset.visible = 'false', 3300);
    }

    function orderMarkup(changed = false) {
      return `<ul class="order-list">${products.map(product => {
        const current = changed && product.id === 'lut' ? 14000 : product.price;
        return `<li class="order-item">
          <div class="product-mark" aria-hidden="true">${product.mark}</div>
          <div><h3>${product.title}</h3><p>${product.kind} · Quantité 1</p>${changed && product.id === 'lut' ? '<small><s>12 000 FCFA</s> · nouveau prix</small>' : ''}</div>
          <strong>${money(current)}</strong>
        </li>`;
      }).join('')}</ul>
      <div class="total"><span class="micro">Total TTC</span><strong>${money(changed ? 29000 : 27000)}</strong></div>
      <p style="margin:10px 0 0;font-size:11px;line-height:1.5;opacity:.68">TVA non applicable · Prix de démonstration à confirmer</p>`;
    }

    function formMarkup(buttonClass) {
      return `<form id="checkout-form" novalidate>
        <div class="form-grid">
          <div class="field field--full"><label for="full-name">Nom complet *</label><input id="full-name" name="name" autocomplete="name" placeholder="Ex. Armand K." required></div>
          <div class="field"><label for="email">Email de livraison *</label><input id="email" name="email" type="email" autocomplete="email" placeholder="vous@exemple.com" required></div>
          <div class="field"><label for="phone">Téléphone international *</label><input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="+229 01 00 00 00 00" required></div>
          <div class="field field--full"><label for="company">Entreprise <span style="font-weight:400">(facultatif)</span></label><input id="company" name="company" autocomplete="organization" placeholder="Nom de l’entreprise"></div>
        </div>
        <div class="checks">
          <label class="check"><input type="checkbox" name="terms" required><span>J’accepte les <a href="#" onclick="return false">CGV en vigueur</a> et reconnais que les prix affichés sont en FCFA.</span></label>
          <label class="check"><input type="checkbox" name="digital" required><span>Je demande la livraison immédiate du contenu numérique et reconnais perdre mon droit de rétractation après le début du téléchargement.</span></label>
        </div>
        <button class="button ${buttonClass}" type="submit">Continuer vers FedaPay · 27 000 FCFA</button>
        <p class="error-copy" id="form-error" data-visible="false" role="alert">Complétez les champs requis et acceptez les deux conditions avant de continuer.</p>
      </form>`;
    }

    function factsMarkup(state, dark = false) {
      const map = {
        pending: [['Statut', 'Confirmation en attente'], ['Vous pouvez', 'Fermer cette page'], ['Suite', 'Email automatique']],
        paid: [['Payé', '27 000 FCFA'], ['Accès', 'Jusqu’au 10 sept. 2026'], ['Reçu', 'Envoyé par email']],
        failed: [['Débité', 'Non'], ['Panier réservé', 'Encore 23 h 41'], ['Réessayer', 'Même commande']],
        fulfillment: [['Paiement', 'Approuvé'], ['Livraison', 'À relancer'], ['Action requise', 'Aucun nouveau paiement']],
        price: [['Ancien total', '27 000 FCFA'], ['Nouveau total', '29 000 FCFA'], ['Écart', '+2 000 FCFA']]
      };
      const facts = map[state] || [['Articles', '2 fichiers'], ['Livraison', 'Après confirmation'], ['Accès', '30 jours · 5 téléchargements']];
      return `<div class="state-facts">${facts.map(([label, value]) => `<div class="state-fact"${dark ? ' style="background:#0a0a0a;color:#fff"' : ''}><strong>${label}</strong><p>${value}</p></div>`).join('')}</div>`;
    }

    function accessMarkup(buttonClass) {
      return `<section aria-labelledby="access-heading">
        <h2 id="access-heading" class="serif" style="font-size:28px;font-weight:500;margin:34px 0 10px">Accès à la commande</h2>
        <p style="margin:0;font-size:13px;line-height:1.6;opacity:.7">Chaque clic génère un lien privé de courte durée. L’accès général expire le 10 septembre 2026.</p>
        <div class="access-list">${products.map(product => `<div class="access-row">
          <div><h3>${product.title}</h3><p>${product.kind} · Lien généré au clic</p></div>
          <div class="download-action"><span id="count-${product.id}">${downloads[product.id]} sur 5<br>restants</span><button class="button ${buttonClass}" data-download="${product.id}" type="button">Télécharger</button></div>
        </div>`).join('')}</div>
      </section>`;
    }

    function providerMarkup(buttonClass) {
      return `<div class="provider-frame">
        <div class="provider-frame__head"><span class="micro">FedaPay · Page hébergée simulée</span><span aria-hidden="true">□</span></div>
        <div class="provider-frame__body"><span class="micro">Montant à payer</span><strong>27 000 FCFA</strong><p>Mobile Money ou carte bancaire. Cette étape est une maquette : aucune donnée ne sera transmise.</p><button class="button ${buttonClass}" data-go="pending" type="button">Simuler le retour vers WeCreate</button></div>
      </div>`;
    }

    function contentMarkup(state, buttonClass, dark = false) {
      if (state === 'cart') return `${factsMarkup(state, dark)}<div class="a-actions"><button class="button ${buttonClass}" data-go="checkout" type="button">Commander les 2 articles</button><a class="button ${dark ? 'button--ghost-dark' : 'button--ghost-light'}" href="#" onclick="return false">Continuer mes achats</a></div>`;
      if (state === 'checkout') return formMarkup(buttonClass);
      if (state === 'redirect') return providerMarkup(buttonClass);
      if (state === 'pending') return `<div class="a-status-line" aria-hidden="true"></div>${factsMarkup(state, dark)}<p style="font-size:13px;line-height:1.65"><strong>Vous pouvez fermer cette page.</strong> La vérification continue sans elle et nous enverrons le reçu ainsi que les téléchargements à votre email.</p><div class="a-actions"><button class="button ${buttonClass}" data-go="paid" type="button">Simuler la confirmation</button><button class="button ${dark ? 'button--ghost-dark' : 'button--ghost-light'}" data-toast="Nous vérifions toujours la confirmation FedaPay." type="button">Vérifier à nouveau</button></div>`;
      if (state === 'paid') return `${factsMarkup(state, dark)}${accessMarkup(buttonClass)}<div class="a-actions"><button class="button ${dark ? 'button--ghost-dark' : 'button--ghost-light'}" data-toast="Reçu de démonstration préparé." type="button">Voir le reçu</button><a class="button ${dark ? 'button--ghost-dark' : 'button--ghost-light'}" href="mailto:wecreate08@gmail.com">Besoin d’aide</a></div>`;
      if (state === 'failed') return `${factsMarkup(state, dark)}<div class="a-actions"><button class="button ${buttonClass}" data-go="redirect" type="button">Réessayer le paiement</button><button class="button ${dark ? 'button--ghost-dark' : 'button--ghost-light'}" data-go="cart" type="button">Modifier le panier</button></div>`;
      if (state === 'price') return `${factsMarkup(state, dark)}<div style="margin-top:28px">${orderMarkup(true)}</div><div class="a-actions"><button class="button ${buttonClass}" data-go="checkout" type="button">Accepter 29 000 FCFA</button><button class="button ${dark ? 'button--ghost-dark' : 'button--ghost-light'}" data-go="cart" type="button">Revenir au panier</button></div>`;
      return `${factsMarkup(state, dark)}<div class="b-proof"><div class="state-symbol" style="width:48px;font-size:24px;flex:0 0 auto">✓</div><div><strong>Votre paiement reste acquis.</strong><p>Notre équipe a été avertie. Vous recevrez les accès dès que la préparation aura abouti, sans nouvelle action de paiement.</p></div></div><div class="a-actions"><button class="button ${buttonClass}" data-toast="Nouvelle tentative de livraison lancée. Aucun nouveau paiement." type="button">Relancer la livraison</button><a class="button ${dark ? 'button--ghost-dark' : 'button--ghost-light'}" href="mailto:wecreate08@gmail.com?subject=Commande%20WC-24-0811">Contacter le support</a></div>`;
    }

    function renderA(state) {
      const copy = stateCopy[state];
      if (state === 'cart') return `<article class="screen drawer-demo" data-variant="A"><div class="drawer-demo__boutique" aria-hidden="true"><p class="eyebrow">Boutique · Outils numériques</p><h1>Nos <em>outils</em>, entre vos mains.</h1><div class="drawer-demo__tiles"><div class="drawer-demo__tile"></div><div class="drawer-demo__tile"></div><div class="drawer-demo__tile"></div></div></div><div class="drawer-demo__veil"></div><aside class="drawer-panel" aria-labelledby="drawer-title"><div class="drawer-panel__head"><div><p class="eyebrow muted-on-dark" style="margin-bottom:8px">Panier numérique · 2</p><h1 id="drawer-title">Votre sélection</h1></div><button type="button" aria-label="Fermer le panier" data-toast="Dans le site réel, ce bouton refermera le panier.">×</button></div><div class="drawer-panel__body">${orderMarkup(false)}<p style="margin:22px 0 0;color:#bbb;font-size:12px;line-height:1.6">Produits numériques uniquement. Livraison par email après confirmation du paiement.</p></div><div class="drawer-panel__foot"><div style="display:flex;justify-content:space-between;gap:18px"><span class="micro">Accès inclus</span><span style="font-size:12px">30 jours · 5 téléchargements</span></div><button class="button button--light" data-go="checkout" type="button">Passer au paiement</button></div></aside></article>`;
      return `<article class="screen variant-a" data-variant="A"><div class="a-layout"><section class="a-main"><div class="state-symbol" aria-hidden="true">${copy.symbol}</div><p class="eyebrow muted-on-light" style="margin-top:30px">${copy.eyebrow}</p><h1 class="title">${copy.title}</h1><p class="lede muted-on-light">${copy.lede}</p><hr class="rule">${contentMarkup(state, 'button--dark')}</section><aside class="a-summary" aria-label="Résumé de la commande"><p class="eyebrow muted-on-light">Résumé fixe</p><h2>Commande numérique</h2>${orderMarkup(state === 'price')}</aside></div></article>`;
    }

    function renderB(state) {
      const copy = stateCopy[state];
      const activeIndex = Math.max(0, states.findIndex(s => s.key === state));
      return `<article class="screen variant-b" data-variant="B"><div class="b-grid"><aside class="b-rail"><p class="eyebrow muted-on-dark">Registre WC-24-0811</p><h2>Du panier à l’accès.</h2><ol class="b-steps">${states.map((s, index) => `<li data-active="${index === activeIndex}"><span>${String(index + 1).padStart(2, '0')}</span><span>${s.label}</span></li>`).join('')}</ol></aside><section class="b-work"><div class="b-work__inner"><div class="state-symbol" aria-hidden="true">${copy.symbol}</div><p class="eyebrow muted-on-dark" style="margin-top:30px">${copy.eyebrow}</p><h1 class="title">${copy.title}</h1><p class="lede muted-on-dark">${copy.lede}</p><div class="b-ledger"><div class="b-panel"><h2>Action et statut</h2>${contentMarkup(state, 'button--dark', true)}</div><aside class="b-panel" aria-label="Résumé de la commande"><h2>Écriture de commande</h2>${orderMarkup(state === 'price')}</aside></div></div></section></div></article>`;
    }

    function renderC(state) {
      const copy = stateCopy[state];
      const stage = state === 'cart' ? 0 : state === 'checkout' || state === 'price' ? 1 : state === 'redirect' || state === 'pending' || state === 'failed' ? 2 : 3;
      return `<article class="screen variant-c" data-variant="C"><div class="c-shell"><aside class="c-ticket" aria-label="Ticket de commande"><div><div class="c-ticket__top"><p class="eyebrow muted-on-dark">Ticket WC-24-0811</p><span class="micro">XOF</span></div><div class="c-ticket__items">${orderMarkup(state === 'price')}</div></div><div><p class="micro muted-on-dark">Snapshot actif</p><p style="margin:8px 0 0;font-size:13px">24 heures après une tentative interrompue.</p></div></aside><section class="c-stage"><div class="c-stage__inner"><div class="c-progress" aria-label="Progression : étape ${stage + 1} sur 4">${[0,1,2,3].map(i => `<span data-active="${i <= stage}"></span>`).join('')}</div><div class="state-symbol" aria-hidden="true">${copy.symbol}</div><p class="eyebrow muted-on-light">${copy.eyebrow}</p><h1 class="title">${copy.title}</h1><p class="lede muted-on-light">${copy.lede}</p><hr class="rule">${contentMarkup(state, 'button--dark')}</div></section></div></article>`;
    }

    function bindActions() {
      document.querySelectorAll('[data-go]').forEach(button => button.addEventListener('click', () => navigate({ state: button.dataset.go })));
      document.querySelectorAll('[data-toast]').forEach(button => button.addEventListener('click', () => showToast(button.dataset.toast)));
      document.querySelectorAll('[data-download]').forEach(button => button.addEventListener('click', () => {
        const id = button.dataset.download;
        if (downloads[id] === 0) return;
        downloads[id] -= 1;
        document.querySelectorAll('#count-' + id).forEach(el => el.innerHTML = `${downloads[id]} sur 5<br>restants`);
        button.disabled = downloads[id] === 0;
        showToast('Lien privé généré pour 10 minutes. Téléchargement simulé.');
      }));
      const form = document.getElementById('checkout-form');
      if (form) form.addEventListener('submit', event => {
        event.preventDefault();
        const valid = form.checkValidity();
        document.getElementById('form-error').dataset.visible = String(!valid);
        if (!valid) { form.reportValidity(); return; }
        navigate({ state: 'redirect' });
      });
    }

    function renderControls(currentState) {
      const nav = document.getElementById('state-nav');
      const select = document.getElementById('state-select');
      nav.innerHTML = states.map(state => `<button type="button" data-state="${state.key}" aria-current="${state.key === currentState}">${state.short}</button>`).join('');
      select.innerHTML = states.map(state => `<option value="${state.key}" ${state.key === currentState ? 'selected' : ''}>${state.label}</option>`).join('');
      nav.querySelectorAll('button').forEach(button => button.addEventListener('click', () => navigate({ state: button.dataset.state })));
      select.onchange = () => navigate({ state: select.value });
    }

    function render() {
      const { variant, state } = query();
      const currentVariant = variants.find(v => v.key === variant);
      const currentState = states.find(s => s.key === state);
      document.documentElement.dataset.variant = variant;
      document.getElementById('header-state').textContent = currentState.label;
      document.getElementById('variant-label').textContent = `${variant} — ${currentVariant.name}`;
      document.getElementById('app').innerHTML = variant === 'A' ? renderA(state) : variant === 'B' ? renderB(state) : renderC(state);
      renderControls(state);
      bindActions();
    }

    function cycleVariant(direction) {
      const { variant } = query();
      const index = variants.findIndex(v => v.key === variant);
      const next = variants[(index + direction + variants.length) % variants.length];
      navigate({ variant: next.key }, false);
    }

    document.getElementById('prev-variant').addEventListener('click', () => cycleVariant(-1));
    document.getElementById('next-variant').addEventListener('click', () => cycleVariant(1));
    window.addEventListener('popstate', render);
    window.addEventListener('keydown', event => {
      const tag = event.target.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || event.target.isContentEditable) return;
      if (event.key === 'ArrowLeft') cycleVariant(-1);
      if (event.key === 'ArrowRight') cycleVariant(1);
    });
    render();
  </script>
</body>
</html>
